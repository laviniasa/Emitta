<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F2A24">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="emitta">
<link rel="icon" href="/static/icone.svg" type="image/svg+xml">
<title>Emitta · Painel do contador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/static/estilo.css?v=21">
<style>
  .topo {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px max(24px, calc((100% - 1360px) / 2 + 24px)); background: var(--noite); color: #fff;
  }
  .marca { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
  .marca:hover { color: #fff; }
  .marca-nome { font-size: 17px; font-weight: 700; }
  .marca-sub { font-size: 13px; color: var(--verde-borda); }
  .marca > span { line-height: 1.25; }
  .topo-botao { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #24524A; background: transparent; color: #fff; font-size: 14px; cursor: pointer; }
  .topo-botao:hover { background: var(--noite-2); }
  .quem { color: var(--verde-borda); font-size: 14px; }
  .senha-gerada { font-family: ui-monospace, monospace; font-size: 20px; letter-spacing: .05em; background: #fff; border: 1px dashed var(--verde); border-radius: 10px; padding: 10px 14px; text-align: center; user-select: all; }
  .segredo { font-family: ui-monospace, monospace; font-size: 17px; letter-spacing: .08em; background: var(--fundo); border-radius: 10px; padding: 12px; text-align: center; word-break: break-all; user-select: all; }
  .passos-2fa { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--texto-2); }
  .linha-acesso { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--borda); font-size: 14px; }
  .linha-acesso:last-child { border-bottom: 0; }
  .layout { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; max-width: 1360px; margin: 0 auto; align-items: flex-start; }
  .lateral { flex: 1 1 260px; display: flex; flex-direction: column; gap: 12px; }
  /* MEI/autônomo: uma empresa só (a dele), sem a lista lateral */
  body.modo-autonomo .lateral { display: none; }
  body.modo-autonomo .principal { flex-basis: 100%; }
  .lista-clientes { display: flex; flex-direction: column; gap: 4px; padding: 8px; }
  .item-cliente {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%;
    min-height: 56px; padding: 10px 12px; border: 0; border-radius: 10px; background: #fff;
    text-align: left; cursor: pointer;
  }
  .item-cliente:hover { background: var(--fundo); }
  .item-cliente[aria-current="true"] { background: var(--verde-claro); }
  .item-cliente .nome { font-weight: 600; }
  .item-cliente .info { font-size: 12px; color: var(--texto-2); }
  .principal { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  .cabecalho-cliente { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 24px; }
  .cabecalho-cliente h1 { font-size: 24px; }
  .cabecalho-cliente .sub { color: var(--texto-2); font-size: 14px; margin-top: 4px; }
  .colunas { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .col-servicos { flex: 3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 20px 24px; }
  .col-lado { flex: 2 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  .servico {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--borda);
    border-radius: var(--raio); background: #fff; cursor: pointer;
  }
  .servico.ligado { border-color: var(--verde); background: #F3FAF8; }
  .servico input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--verde); margin: 0; flex-shrink: 0; }
  .servico .textos { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .servico .apelido {
    border: 1px solid transparent; border-radius: 8px; padding: 2px 6px; margin-left: -6px;
    font-weight: 600; font-size: 15px; background: transparent; width: 100%;
  }
  .servico .apelido:hover { border-color: var(--borda); }
  .servico .apelido:focus { border-color: var(--verde); outline: none; background: #fff; }
  .servico .oficial { font-size: 12px; color: var(--texto-2); }
  .servico .nome-servico { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .cod-mun { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; color: var(--texto-2); font-weight: 600; }
  .cod-mun input { width: 74px; min-height: 32px; padding: 4px 10px !important; font-size: 13px; border-radius: 8px; }
  /* ---- tela da empresa: passo a passo, abas, cartões e janela de serviços ---- */
  .visualmente-oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .passos { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; background: var(--verde-claro); border-color: #D7EDB0; }
  .passos-titulo { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .passos-lista { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .passo { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 12px; border-radius: 12px; border: 1.5px solid #D7EDB0; background: #fff; font: inherit; font-size: 14px; font-weight: 600; color: var(--texto); cursor: pointer; text-align: left; }
  .passo:hover { border-color: var(--verde); }
  .passo.atual { border-color: var(--noite); }
  .passo-num { width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; background: var(--fundo); color: var(--texto); font-size: 13px; font-weight: 700; }
  .passo.feito .passo-num { background: var(--lima); color: var(--noite); }
  .passo.feito { color: var(--texto-2); }
  .abas-empresa { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .abas-empresa::-webkit-scrollbar { display: none; }
  .aba-empresa { flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--borda); background: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--texto); }
  .aba-empresa[aria-selected="true"] { background: var(--noite); border-color: var(--noite); color: #fff; }
  .aba-qtd { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--fundo); color: var(--texto); }
  .aba-empresa[aria-selected="true"] .aba-qtd { background: var(--lima); color: var(--noite); }
  .painel-aba { display: flex; flex-direction: column; gap: 16px; }
  .chave-vista { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--fundo); }
  .chave-vista button { min-height: 42px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: var(--texto-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .chave-vista button[aria-selected="true"] { background: #fff; color: var(--texto); box-shadow: 0 1px 4px rgba(15,42,36,.12); }
  .linha-catalogo.ligada .nome-servico { color: var(--verde); }
  .area-qtd.area-lib { background: var(--lima); color: var(--noite); font-weight: 700; }
  .cabecalho-secao { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .vazio-servicos { padding: 28px 16px; text-align: center; border: 1.5px dashed var(--borda); border-radius: var(--raio); display: flex; flex-direction: column; gap: 4px; }
  .cartao-servico { border: 1.5px solid #D7EDB0; background: #FBFEF5; border-radius: var(--raio); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .cartao-topo { display: flex; gap: 10px; align-items: flex-start; }
  .cartao-topo .textos { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .cartao-servico .apelido { width: 100%; font-weight: 700; font-size: 15px; }
  .cartao-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .botao-icone { width: 36px; height: 36px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: var(--texto-2); cursor: pointer; }
  .botao-icone:hover { background: var(--fundo); color: var(--texto); }
  .mais-opcoes summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--verde); list-style: none; }
  .mais-opcoes summary::-webkit-details-marker { display: none; }
  .mais-opcoes summary::before { content: "▸ "; }
  .mais-opcoes[open] summary::before { content: "▾ "; }
  .mais-opcoes-corpo { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
  .botao-mini[disabled] { opacity: .6; cursor: default; }
  .janela-fundo { position: fixed; inset: 0; z-index: 50; background: rgba(15,42,36,.45); display: grid; place-items: center; padding: 16px; animation: aparecer .2s ease; }
  .janela { width: min(640px, 100%); max-height: min(86vh, 900px); background: #fff; border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 12px; padding: 18px 18px 14px; }
  .janela-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .janela-corpo { overflow-y: auto; flex: 1; min-height: 160px; margin: 0 -6px; padding: 0 6px; }
  .janela-rodape { display: flex; justify-content: flex-end; padding-top: 6px; border-top: 1px solid var(--borda); }
  .linha-catalogo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--borda); }
  .linha-catalogo .textos { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  details.area > .linha-catalogo { margin: 0 12px; }
  @media (max-width: 640px) {
    .passos { padding: 12px; }
    .passo { flex-direction: column; justify-content: center; gap: 4px; min-height: 64px; padding: 8px 4px; text-align: center; font-size: 12.5px; }
    .janela-fundo { padding: 0; place-items: end stretch; }
    .janela { width: 100%; max-height: 92vh; border-radius: 22px 22px 0 0; }
  }
  .conferir { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
  .botao-mini { white-space: nowrap; flex-shrink: 0; border: 1.5px solid var(--borda); background: #fff; color: var(--texto); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .botao-mini:hover { border-color: var(--verde); }
  .escolher-cod { display: inline-flex; gap: 6px; }
  .botao-mini.escolhido { background: var(--verde); color: #fff; border-color: var(--verde); }
  .resultado-pref { font-size: 12.5px; font-weight: 600; }
  .resultado-pref.ok { color: #1C7A43; }
  .resultado-pref.nao { color: #B3261E; }
  .resultado-pref.neutro { color: var(--texto-2); font-weight: 500; }
  .busca-servico-caixa { margin-top: 10px; padding-top: 16px; border-top: 1px solid var(--borda); display: flex; flex-direction: column; gap: 10px; }
  .titulo-busca { font-size: 15px; }
  .busca-servico-campo { display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 1.5px solid var(--borda); border-radius: var(--raio); background: #fff; color: var(--texto-2); }
  .busca-servico-campo:focus-within { border-color: var(--verde); }
  .busca-servico { flex: 1; border: 0 !important; outline: none; min-height: 48px; font-size: 15px; background: transparent; padding: 0 !important; box-shadow: none !important; }
  .resultados-servicos { display: flex; flex-direction: column; gap: 10px; }
  details.area { border: 1px solid var(--borda); border-radius: var(--raio); background: #fff; }
  details.area[open] { padding-bottom: 10px; }
  details.area > .servico { margin: 0 10px 8px; }
  details.area summary { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; list-style: none; font-size: 14px; }
  details.area summary::-webkit-details-marker { display: none; }
  details.area summary::after { content: "›"; margin-left: auto; font-size: 20px; color: var(--texto-2); transition: transform .2s; }
  details.area[open] summary::after { transform: rotate(90deg); }
  .area-cod { font-weight: 700; color: var(--verde); min-width: 22px; }
  .area-nome { font-weight: 600; flex: 1; }
  .area-qtd { font-size: 12px; color: var(--texto-2); background: var(--fundo); border-radius: 999px; padding: 2px 9px; }
  .previa { background: var(--verde-claro); border-color: var(--verde-borda); display: flex; flex-direction: column; gap: 10px; }
  .previa h2 { font-size: 15px; color: var(--verde-escuro); }
  .previa .linha { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--noite); }
  h2.titulo { font-size: 17px; }
  .sub2 { color: var(--texto-2); font-size: 14px; }
  .regras { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .regras .linha { display: flex; justify-content: space-between; gap: 12px; }
  .regras .linha span:first-child { color: var(--texto-2); }
  .tabela-caixa { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--texto-2); padding: 8px 10px; border-bottom: 1px solid var(--borda); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  td.valor { text-align: right; white-space: nowrap; }
  .form-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .acoes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
  .busca input { width: 100%; }
</style>
</head>
<body>
<header class="topo">
  <a class="marca" href="/">
    <svg class="marca-svg" width="34" height="40" viewBox="17 10 66 78" aria-hidden="true"><path class="logo-papel" d="M27 14 H73 Q79 14 79 20 V84 L71.75 78.5 L64.5 84 L57.25 78.5 L50 84 L42.75 78.5 L35.5 84 L28.25 78.5 L21 84 V20 Q21 14 27 14 Z" fill="#C6F36B"/><path class="logo-e" pathLength="1" d="M35 46 H65 A15 15 0 1 0 60.6 56.6" fill="none" stroke="#0F2A24" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span><span class="marca-nome">emitta</span><br><span class="marca-sub">Painel do contador</span></span>
  </a>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap" id="topo-acoes">
    <span class="selo selo-amarelo" id="selo-ambiente">Simulação</span>
  </div>
</header>

<div class="layout">
  <nav class="lateral" aria-label="Empresas">
    <button class="botao" id="btn-nova-empresa" type="button"></button>
    <div class="card" style="padding:12px">
      <label class="campo busca">Buscar empresa
        <input type="search" id="busca-cliente" placeholder="Nome ou CNPJ" autocomplete="off">
      </label>
    </div>
    <div class="card lista-clientes" id="lista-clientes" aria-live="polite"></div>
  </nav>

  <main class="principal" id="principal" aria-live="polite"></main>
</div>

<script src="/static/comum.js?v=21"></script>
<script src="/static/assistente.js?v=21"></script>
<script src="/static/painel.js?v=21"></script>
<script src="/static/pwa.js?v=21"></script>
</body>
</html>
