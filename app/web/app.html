<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A24">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="emitta">
<link rel="icon" href="/static/icone.svg" type="image/svg+xml">
<title>Emitta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/static/estilo.css?v=12">
<style>
  body { background: #E4E9DC; }
  .tela {
    max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; background: var(--fundo);
    display: flex; flex-direction: column;
  }
  .barra {
    display: flex; align-items: center; gap: 8px; padding: 14px 16px 12px 8px;
    background: #fff; border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 5;
  }
  .barra h1 { font-size: 20px; font-weight: 700; flex: 1; }
  .barra .sub { font-size: 13px; color: var(--texto-2); }
  .voltar { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; border-radius: 10px; color: var(--texto); }
  .voltar:hover { background: var(--fundo); }
  .voltar:active { transform: scale(.9); }
  .voltar { transition: transform .18s var(--mola), background .2s ease; }
  .conteudo { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .rodape {
    padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); background: #fff;
    border-top: 1px solid var(--borda); display: flex; flex-direction: column; gap: 10px;
    position: sticky; bottom: 0;
  }
  .heroi { position: relative; overflow: hidden; isolation: isolate; background: var(--noite); color: #fff; padding: 22px 20px 26px; display: flex; flex-direction: column; gap: 16px; border-radius: 0 0 28px 28px; }
  /* bolhas de cor se mexendo devagar atrás do cabeçalho */
  .heroi::before, .heroi::after { content: ""; position: absolute; z-index: -1; border-radius: 50%; filter: blur(30px); opacity: .55; }
  .heroi::before { width: 220px; height: 220px; right: -60px; top: -80px; background: #C6F36B; opacity: .28; animation: flutua 9s ease-in-out infinite; }
  .heroi::after { width: 180px; height: 180px; left: -70px; bottom: -90px; background: #2BB673; opacity: .3; animation: flutua 11s ease-in-out infinite reverse; }
  @keyframes flutua { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-24px, 18px); } }
  .heroi h1 { font-size: 20px; }
  .heroi .ola { font-size: 13px; color: var(--verde-borda); }
  .resumo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .resumo div { background: rgba(255,255,255,.07); border: 1px solid rgba(198,243,107,.18); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; backdrop-filter: blur(6px); }
  .resumo .rot { font-size: 12px; color: var(--verde-borda); }
  .resumo .num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .nota-item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    padding: 14px 16px; background: #fff; border: 1px solid var(--borda); border-radius: 16px;
    text-align: left; cursor: pointer; transition: transform .18s var(--mola), border-color .2s ease, box-shadow .2s ease;
  }
  .nota-item:hover { border-color: var(--lima-forte); box-shadow: 0 6px 18px -10px rgba(15,42,36,.35); }
  .nota-item:active { transform: scale(.98); }
  .nota-item .esq { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .nota-item .dir { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .nota-item .nome { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nota-item .det { font-size: 12px; color: var(--texto-2); }
  .menu {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #fff;
    border-top: 1px solid var(--borda); padding: 6px 8px calc(14px + env(safe-area-inset-bottom));
    position: sticky; bottom: 0;
  }
  .menu button {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 52px;
    border: 0; background: transparent; font-size: 12px; font-weight: 500; color: var(--texto-2); cursor: pointer;
    border-radius: 14px; transition: transform .18s var(--mola), color .2s ease;
  }
  .menu button:active { transform: scale(.9); }
  .menu button svg { transition: transform .3s var(--mola); }
  .menu button[aria-current="page"] { color: var(--noite); font-weight: 700; }
  .menu button[aria-current="page"] svg { background: var(--lima); border-radius: 999px; padding: 4px; width: 32px; height: 32px; margin: -6px 0 -2px; animation: pop .4s var(--mola); }
  .secao { display: flex; flex-direction: column; gap: 12px; }
  .secao-titulo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .secao-titulo h2 { font-size: 15px; font-weight: 600; }
  .ajuda-pequena { font-size: 12px; color: var(--texto-2); line-height: 1.5; }
  .totais { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .totais .linha { display: flex; justify-content: space-between; }
  .totais .total { font-size: 17px; font-weight: 700; }
  .centro { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 16px 0 4px; }
  .circulo { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; }
  .grande { font-size: 20px; font-weight: 700; }
  .detalhes { display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
  .detalhes .linha { display: flex; justify-content: space-between; gap: 12px; }
  .detalhes .linha span:first-child { color: var(--texto-2); }
  .detalhes .linha span:last-child { text-align: right; }
  .chave { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; background: var(--fundo); padding: 8px 10px; border-radius: 8px; }
  .etapas { list-style: none; margin: 0; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .etapas li { display: flex; align-items: center; gap: 12px; }
  .etapas .marca { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; }
  .etapas .feita { background: var(--verde); }
  .etapas .agora { border: 2px solid var(--verde); }
  .etapas .agora::after { content: ""; width: 10px; height: 10px; border-radius: 999px; background: var(--verde); animation: piscar 1s ease-in-out infinite; }
  @keyframes piscar { 50% { transform: scale(.4); opacity: .4; } }
  .etapas li { animation: aparecer .45s var(--suave) backwards; }
  .etapas li:nth-child(2) { animation-delay: .25s; } .etapas li:nth-child(3) { animation-delay: .5s; } .etapas li:nth-child(4) { animation-delay: .75s; }

  /* ---------- troca de tela: desliza para o lado certo */
  .tela.animando[data-dir="vai"] > main, .tela.animando[data-dir="vai"] > .heroi { animation: entrar-direita .35s var(--suave); }
  .tela.animando[data-dir="volta"] > main, .tela.animando[data-dir="volta"] > .heroi { animation: entrar-esquerda .35s var(--suave); }
  .tela.animando .conteudo > * { animation: aparecer .45s var(--suave) backwards; }
  .tela.animando .conteudo > :nth-child(2) { animation-delay: .05s; } .tela.animando .conteudo > :nth-child(3) { animation-delay: .1s; }
  .tela.animando .conteudo > :nth-child(4) { animation-delay: .15s; } .tela.animando .conteudo > :nth-child(5) { animation-delay: .2s; }
  .tela.animando .conteudo > :nth-child(6) { animation-delay: .25s; } .tela.animando .conteudo > :nth-child(7) { animation-delay: .3s; }
  .tela.animando .conteudo > :nth-child(n+8) { animation-delay: .35s; }
  .tela.animando .rodape { animation: aparecer .4s var(--suave) .15s backwards; }

  /* ---------- impressora: o cupom saindo enquanto envia */
  .impressora { position: relative; width: 168px; height: 150px; margin: 6px auto 0; }
  .impressora .corpo { position: absolute; left: 0; right: 0; top: 0; height: 46px; border-radius: 16px; background: var(--noite); box-shadow: inset 0 -6px 0 rgba(0,0,0,.25); }
  .impressora .corpo::after { content: ""; position: absolute; right: 16px; top: 18px; width: 8px; height: 8px; border-radius: 50%; background: var(--lima); animation: piscar .8s ease-in-out infinite; }
  .impressora .fenda { position: absolute; left: 24px; right: 24px; top: 38px; height: 112px; overflow: hidden; }
  .impressora .papel { position: absolute; left: 6px; right: 6px; top: 0; height: 104px; background: #fff; border-radius: 0 0 4px 4px;
    box-shadow: 0 6px 14px -6px rgba(15,42,36,.35); padding: 14px 12px; display: flex; flex-direction: column; gap: 8px;
    animation: imprimir 1.8s var(--suave) infinite; }
  .impressora .papel span { height: 6px; border-radius: 3px; background: #DCE3D3; }
  .impressora .papel span:nth-child(2) { width: 70%; } .impressora .papel span:nth-child(3) { width: 85%; background: var(--lima); }
  .impressora .papel::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px;
    background: linear-gradient(-45deg, transparent 6px, #fff 0) 0 0 / 12px 8px, linear-gradient(45deg, transparent 6px, #fff 0) 0 0 / 12px 8px; }
  @keyframes imprimir { 0% { transform: translateY(-100%); } 60%, 80% { transform: translateY(0); } 100% { transform: translateY(0); opacity: 0; } }

  /* ---------- nota autorizada: o cupom cai, o visto se desenha, confete */
  .cupom-ok { position: relative; width: 118px; height: 132px; margin-top: 4px; animation: cair .7s var(--mola); }
  .cupom-ok svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 12px 18px rgba(120,170,30,.35)); }
  .cupom-ok .visto { stroke-dasharray: 60; stroke-dashoffset: 60; animation: desenhar .5s ease-out .45s forwards; }
  @keyframes cair { from { transform: translateY(-60px) rotate(-10deg) scale(.6); opacity: 0; } }
  @keyframes desenhar { to { stroke-dashoffset: 0; } }
  .confete { position: fixed; top: -12px; width: 9px; height: 14px; border-radius: 2px; z-index: 60; pointer-events: none; animation: confete var(--t, 2.2s) cubic-bezier(.25,.6,.4,1) forwards; }
  @keyframes confete { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 540deg)); opacity: .9; } }

  /* ---------- carimbo de cancelada e alerta */
  .carimbo { animation: carimbar .5s var(--mola); }
  @keyframes carimbar { from { transform: scale(2.2) rotate(-14deg); opacity: 0; } }
  .balanca { animation: balancar .6s ease-in-out 2; }
  .etapas .depois { border: 2px solid #9CA3AF; }
  .empresa-item { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; width: 100%; padding: 14px 16px; min-height: 60px; border: 1px solid var(--borda); background: #fff; border-radius: 12px; cursor: pointer; text-align: left; }
  .empresa-item:hover { border-color: var(--verde); }
  .empresa-item .det { font-size: 12px; color: var(--texto-2); }
</style>
</head>
<body>
<div class="tela" id="tela" aria-live="polite"></div>
<script src="/static/comum.js?v=12"></script>
<script src="/static/app.js?v=12"></script>
<script src="/static/pwa.js?v=12"></script>
</body>
</html>
