<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F2A24">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="emitta">
<link rel="icon" href="/static/icone.svg" type="image/svg+xml">
<title>Emitta · Administração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/static/estilo.css?v=14">
<style>
  .topo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px max(16px, calc((100% - 1180px) / 2 + 16px)); background: var(--noite); color: #fff; }
  .marca { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
  .marca:hover { color: #fff; }
  .marca-nome { font-size: 17px; font-weight: 700; }
  .marca-sub { font-size: 13px; color: var(--verde-borda); }
  .marca > span { line-height: 1.25; }
  .topo-botao { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #24524A; background: transparent; color: #fff; font-size: 14px; cursor: pointer; }
  .topo-botao:hover { background: var(--noite-2); }
  .quem { color: var(--verde-borda); font-size: 14px; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; }
  .estreito { max-width: 460px; margin: 0 auto; width: 100%; }
  .bloco { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .bloco h1 { font-size: 22px; }
  .bloco h2 { font-size: 17px; }
  .sub { color: var(--texto-2); font-size: 14px; line-height: 1.5; }
  form { display: flex; flex-direction: column; gap: 14px; }
  .abas { display: flex; gap: 6px; flex-wrap: wrap; }
  .aba { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--borda); background: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--texto); }
  .aba[aria-selected="true"] { background: var(--noite); border-color: var(--noite); color: #fff; }
  .resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .numero { padding: 16px 18px; }
  .numero strong { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .numero span { font-size: 13px; color: var(--texto-2); }
  button.numero { text-align: left; font: inherit; cursor: pointer; }
  .pendente { border: 2px solid #E9B949; background: #FFF8E6; }
  .pendente span { color: #8A5A00; font-weight: 600; }
  .pedidos { border: 2px solid #E9B949; }
  .filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .filtros .campo { min-width: 200px; flex: 1 1 200px; }
  .tabela-caixa { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--texto-2); padding: 8px 10px; border-bottom: 1px solid var(--borda); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  td.quando, td.ip { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--texto-2); }
  .tipo-alerta { color: var(--vermelho, #B42318); font-weight: 600; }
  .tipo-admin { color: var(--verde-escuro); font-weight: 600; }
  .conta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--borda); }
  .conta:last-child { border-bottom: 0; }
  .conta .info { display: flex; flex-direction: column; gap: 4px; min-width: 220px; flex: 1 1 280px; }
  .conta .nome { font-weight: 600; }
  .conta .detalhes { font-size: 13px; color: var(--texto-2); }
  .conta .selos { display: flex; gap: 6px; flex-wrap: wrap; }
  .conta .acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
  .conta .acoes .botao { min-height: 36px; padding: 0 12px; font-size: 13px; }
  .senha-gerada { font-family: ui-monospace, monospace; font-size: 20px; letter-spacing: .05em; background: #fff; border: 1px dashed var(--verde); border-radius: 10px; padding: 10px 14px; text-align: center; user-select: all; }
  .segredo { font-family: ui-monospace, monospace; font-size: 17px; letter-spacing: .08em; background: var(--fundo); border-radius: 10px; padding: 12px; text-align: center; word-break: break-all; user-select: all; }
  .passos { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--texto-2); }
  .codigo { font-size: 24px !important; letter-spacing: .35em; text-align: center; }
</style>
</head>
<body>
<header class="topo">
  <a class="marca" href="/admin">
    <svg class="marca-svg" width="34" height="40" viewBox="17 10 66 78" aria-hidden="true"><path class="logo-papel" d="M27 14 H73 Q79 14 79 20 V84 L71.75 78.5 L64.5 84 L57.25 78.5 L50 84 L42.75 78.5 L35.5 84 L28.25 78.5 L21 84 V20 Q21 14 27 14 Z" fill="#C6F36B"/><path class="logo-e" pathLength="1" d="M35 46 H65 A15 15 0 1 0 60.6 56.6" fill="none" stroke="#0F2A24" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span><span class="marca-nome">emitta</span><br><span class="marca-sub">Administração</span></span>
  </a>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap" id="topo-acoes"></div>
</header>
<main id="principal" aria-live="polite"></main>
<script src="/static/comum.js?v=14"></script>
<script src="/static/admin.js?v=14"></script>
<script src="/static/pwa.js?v=14"></script>
</body>
</html>
